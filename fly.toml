# Fly.io configuration for the MCP server.
#
# Run from repo root:
#   fly launch --no-deploy --name bing-images-mcp     # one-time
#   fly deploy
#
# Health check: /healthz
# Public test:  curl https://<app>.fly.dev/debug/peapix

app = "bing-images-mcp"          # change if the name is taken
primary_region = "iad"           # Ashburn, VA. We'll test, may switch.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # scale to zero when idle (saves free credits)
  auto_start_machines = true      # wake on first request
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    timeout = "5s"
    path = "/healthz"

# Free-tier sized VM (256MB RAM is plenty for httpx + Starlette).
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
